<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>POSTURE LAB リンク版</title>
<style>
:root{
  --bg:#0b1220; --surface:#131f32; --surface2:#0d1727; --surface3:#192840;
  --line:#2a3c55; --line2:#40516b; --text:#e9eff8; --dim:#9eafc7; --dim2:#b9c8da;
  --accent:#2fb3c9; --accent-strong:#146c82; --accent-soft:#8edbc9; --good:#91ddc6;
  --warn-bg:#392c27; --warn-line:#a97e47; --warn-text:#ffdeb2;
  --danger-bg:#622c39; --danger-line:#a95b6b;
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.38;cursor:not-allowed}
.shell{max-width:1160px;margin:0 auto;padding:14px 14px 90px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.status{font-size:12px;color:var(--accent-soft)}
.btn{background:var(--accent-strong);color:#fff;border:1px solid #42aabd;border-radius:9px;padding:10px 14px;font-weight:650}
.btn.secondary{background:#22314a;border-color:#425572;color:var(--text)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-line)}
.btn.small{padding:6px 10px;font-size:13px}
.nav{display:flex;gap:7px;flex-wrap:wrap;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.nav button{white-space:nowrap;background:#17243a;color:#c8d6e8;border:1px solid #30415d;border-radius:9px;padding:9px 12px;font-weight:650}
.nav button.active{background:var(--accent-strong);color:#fff;border-color:#45bfd4}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.catgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr 1fr;gap:8px}.panel{padding:12px}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 8px}
p{line-height:1.6;margin:6px 0}
.muted{color:var(--dim);font-size:13px}
label.lbl{display:block;margin:9px 0 5px;color:var(--dim2);font-size:13px}
input[type=text],input[type=date],input[type=datetime-local],input[type=number],textarea,select{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:6px;background:#284059;color:#b8e4eb}
.tag.good{background:#17453c;color:var(--good)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #3c516e;border-radius:8px;padding:7px 10px;margin:3px 2px;background:var(--surface3);font-size:14px;cursor:pointer;user-select:none;white-space:nowrap}
.chip.on{border-color:#42c4d7;background:#16465a;color:#fff;font-weight:650}
.chip.off{opacity:.35}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{background:var(--surface3);border:0;border-right:1px solid var(--line2);padding:9px 14px;font-size:14px;color:var(--dim2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-strong);color:#fff;font-weight:700}
.optbtn{border:1px solid #40516b;background:var(--surface3);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:650;color:var(--text)}
.optbtn.on{border-color:var(--accent);background:var(--accent);color:#06222b}
.optbtn.small{padding:6px 9px;font-size:13px}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:12px;color:var(--warn-text);margin:10px 0;line-height:1.6}
details.fold{border:1px solid #334963;border-radius:10px;padding:10px 12px;margin:10px 0}
details.fold>summary{cursor:pointer;font-weight:650}
.test{border:1px solid #334963;border-radius:11px;padding:13px;margin:10px 0;background:#18283e}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:8px;border-bottom:1px solid #34445a;text-align:left;vertical-align:top}
.section{border-top:1px solid #31415b;padding-top:12px;margin-top:14px}
.level{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.level.clue{background:#17453c;color:var(--good)}
.level.unknown{background:#284059;color:#b8e4eb}
.level.unlikely{background:#3a3049;color:#cbb8e8}
.level.mixed{background:#4d3a14;color:#ffcf7d}
.modal{position:fixed;inset:0;background:rgba(3,8,16,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--surface);border:1px solid var(--line2);border-radius:16px 16px 0 0;max-width:720px;width:100%;max-height:88vh;overflow-y:auto;padding:18px}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:16px}}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;line-height:1.55}
.kv dt{color:var(--dim);font-size:13px}
.kv dd{margin:0}
.footer{color:var(--dim);font-size:12px;margin-top:28px;line-height:1.7}
.stickyActions{position:sticky;bottom:0;background:rgba(11,18,32,.95);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;z-index:4}
.numin{width:96px!important}
.banner{background:#173a4a;border:1px solid #2b6b7d;border-radius:10px;padding:12px;margin:10px 0;line-height:1.6}
.good{color:var(--good)}
.guidebody{white-space:pre-wrap;line-height:1.75;font-size:14px;color:var(--dim2)}
.pdfgen{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#000;padding:34px 38px;font-size:14px;line-height:1.65}
.pdfgen h1{font-size:21px;margin:0 0 10px}
.pdfgen h2{font-size:15.5px;margin:18px 0 6px;border-bottom:1.5px solid #333;padding-bottom:3px}
.pdfgen p{margin:4px 0;line-height:1.65}
.pdfgen table{border-collapse:collapse;width:100%;font-size:13px}
.pdfgen td,.pdfgen th{border:1px solid #888;padding:5px 7px;text-align:left;vertical-align:top;color:#000}
.pdfgen .prwarn{border:1px solid #a97e47;background:#fbf3e2;padding:8px 10px;margin:10px 0}
.pdfgen .prnote{font-size:12px;color:#444;border:1px solid #aaa;padding:8px 10px;margin-top:16px}
</style>
</head>
<body>
<main class="shell">
  <div class="toprow">
    <span class="status" id="saved">記録はこの端末のブラウザに保存されます</span>
    <span class="row">
      <button class="btn secondary small" onclick="exportJSON()">JSON保存</button>
      <button class="btn secondary small" onclick="document.getElementById('importfile').click()">JSON読込</button>
      <input id="importfile" type="file" accept="application/json" hidden onchange="importJSON(event)">
    </span>
  </div>
  <div id="banners"></div>
  <nav class="nav" id="nav"></nav>
  <div id="content"></div>
  <div class="stickyActions" id="actions"></div>
  <div class="footer">専門家の運動機能評価を補助するツールです。医学的診断・病因の確定・治療効果の保証は行いません。記録はこの端末のブラウザ内（localStorage）に保存され、サーバー版の記録とは共有されません。共有端末で個人情報を入力しないでください。</div>
  <div style="margin-top:16px">
    <button class="btn secondary small" onclick="exportSpecJSON()">開発用：仕様JSONをエクスポート</button>
    <span class="status" id="specStatus" style="margin-left:8px"></span>
    <p class="muted" style="margin-top:6px">開発・監査用（読み取り専用）：評価カテゴリ・追加テスト・仮説・リリース候補の全定義と推論エンジンの関数ソースを、顧客・セッション情報を含まずにJSONで書き出します。</p>
  </div>
</main>
<div id="modalroot"></div>

<script>
'use strict';
/* ================= カタログ：カテゴリ（本編と同一） ================= */
const UNVERIFIED='エビデンス未確認';

const A=(id,label,group)=>({id,label,origin:'app',group});
const NORMAL={id:'normal',label:'異常なし',origin:'sheet'};
const CATEGORIES=[
{id:'weight',no:1,ja:'荷重足',en:'Weighted foot',bilateral:false,plane:'前額面・矢状面（荷重分布）',options:[S('balanced','均等','lr'),S('right','右優位','lr'),S('left','左優位','lr'),S('forefoot','前足部','fb'),S('heel','踵','fb')]},
{id:'breath',no:2,ja:'呼吸',en:'Breath',bilateral:false,plane:'呼吸運動（胸腹の拡張）',note:'胸式と腹式は混合パターンがあり得るため、相互の同時選択は制限していません。',options:[S('thoracic','胸式'),S('abdominal','腹式'),S('shallow','浅い'),S('asymmetry','左右差')]},
{id:'head',no:3,ja:'頭部',en:'Head',bilateral:false,plane:'矢状面・前額面・水平面',options:[S('forward','前方偏位','sag'),S('backward','後方偏位','sag'),S('tilt_r','右側屈','front'),S('tilt_l','左側屈','front'),S('rot_r','右回旋','trans'),S('rot_l','左回旋','trans')]},
{id:'neck',no:4,ja:'頸部',en:'Neck',bilateral:false,plane:'矢状面・前額面・水平面',options:[S('hyper','前弯増強','curve'),S('hypo','前弯減少','curve'),S('tilt_r','右側屈','front'),S('tilt_l','左側屈','front'),S('rot_r','右回旋','trans'),S('rot_l','左回旋','trans')]},
{id:'girdle',no:5,ja:'肩甲帯',en:'Shoulder girdle',bilateral:true,plane:'前額面・矢状面',note:'MVP 0.1の「肩の高さの左右差」は、このカテゴリの左右別「挙上」の差として表現されます。',options:[S('elev','挙上','vert'),S('depr','下制','vert'),S('ant','前方','ap'),S('post','後方','ap'),S('wing','翼状')]},
{id:'shoulder',no:6,ja:'肩関節',en:'Shoulder joint',bilateral:true,plane:'水平面・矢状面',options:[S('ir','内旋','rot'),S('er','外旋','rot'),S('ant_disp','前方変位'),NORMAL]},
{id:'thorax',no:7,ja:'胸郭',en:'Thorax / Rib cage',bilateral:false,plane:'矢状面・水平面',options:[S('ant','前方','ap'),S('post','後方','ap'),S('rot_r','右回旋','rot'),S('rot_l','左回旋','rot'),S('flare','フレア')]},

{id:'pelvis',no:9,ja:'骨盤帯',en:'Pelvic girdle',bilateral:false,plane:'矢状面・前額面・水平面',note:'右回旋・左回旋は、原紙の「回旋」を方向別に分割したアプリ追加項目です（仕様指示に基づく）。',options:[S('ant','前傾','tilt'),S('post','後傾','tilt'),S('up_r','右挙上','elev'),S('up_l','左挙上','elev'),A('rot_r','右回旋','rot'),A('rot_l','左回旋','rot')]},
{id:'hip',no:10,ja:'股関節',en:'Hip joint',bilateral:true,plane:'水平面・前額面',options:[S('ir','内旋','rot'),S('er','外旋','rot'),S('add','内転','add'),S('abd','外転','add'),NORMAL]},
{id:'knee',no:11,ja:'膝',en:'Knee',bilateral:true,plane:'前額面・矢状面',options:[S('valgus','外反','align'),S('varus','内反','align'),S('hyper','過伸展'),NORMAL]},
{id:'ankle',no:12,ja:'足根',en:'Ankle',bilateral:true,plane:'矢状面・前額面',note:'足根には原紙に「異常なし」の欄がないため、3状態管理（未評価／評価済／判断不能）はアプリ側の追加仕様です。',options:[S('dorsi','背屈位','sag'),S('plantar','底屈位','sag'),S('inv','内反','front'),S('ever','外反','front')]},
{id:'subtalar',no:13,ja:'距骨下関節',en:'Subtalar joint',bilateral:true,plane:'前額面（回内・回外）',options:[S('pron','回内','rot'),S('sup','回外','rot'),NORMAL]},
{id:'arch',no:14,ja:'足アーチ',en:'Arch',bilateral:true,plane:'矢状面・水平面（アーチ構造）',note:'原紙・v1.1.2の表記は「横低下」です。仕様の実装リストに従い「横アーチ低下」と表示しています。',options:[S('low','低下','height'),S('high','高位','height'),S('trans_low','横アーチ低下'),NORMAL]}
];
const catById=id=>CATEGORIES.find(c=>c.id===id);
const optLabel=(cat,oid)=>(cat.options.find(o=>o.id===oid)||{}).label||oid;
function optionsConflict(cat,a,b){if(a===b)return false;if(a==='normal'||b==='normal')return true;const oa=cat.options.find(o=>o.id===a),ob=cat.options.find(o=>o.id===b);return !!(oa&&oa.group&&oa.group===ob.group)}
const fkey=(catId,side)=>catId+':'+side;
const emptyFinding=()=>({status:'unevaluated',selected:[],note:'',value:null,unit:''});
function displayStatus(f){if(!f||f.status==='unevaluated')return '未評価';if(f.status==='unable')return '判断不能';if(f.selected.length===0)return '所見なし';if(f.selected.length===1&&f.selected[0]==='normal')return '異常なし';return '所見あり'}
const hasFinding=f=>displayStatus(f)==='所見あり';
const emptyTest=()=>({result:'not_done',optionValue:'',valueRight:null,valueLeft:null,unit:'',note:''});
const testDone=t=>!!t&&(t.optionValue!==''||t.result!=='not_done'||t.valueRight!=null||t.valueLeft!=null);
const verdictOf=t=>!t?'':t.optionValue!==''?t.optionValue:(t.result==='not_done'?'':t.result);
function triggerMatches(findings,tr){const cat=catById(tr.cat);if(!cat)return[];const hits=[];
  if(tr.asym&&cat.bilateral){const r=findings[fkey(tr.cat,'right')],l=findings[fkey(tr.cat,'left')];const rs=((r&&r.selected)||[]).slice().sort().join(','),ls=((l&&l.selected)||[]).slice().sort().join(',');if((hasFinding(r)||hasFinding(l))&&rs!==ls)hits.push(cat.ja+'の左右差');return hits}
  const sides=cat.bilateral?['right','left']:['none'];
  for(const side of sides){const f=findings[fkey(tr.cat,side)];if(!hasFinding(f))continue;for(const opt of f.selected){if(tr.opts.indexOf(opt)>=0){const sl=side==='right'?'右':side==='left'?'左':'';hits.push(cat.ja+sl+'「'+optLabel(cat,opt)+'」')}}}
  return hits}
function anyTriggerHits(findings,triggers){const out=[];for(const tr of triggers)out.push.apply(out,triggerMatches(findings,tr));return Array.from(new Set(out))}
function activeTagCats(findings){const tags=new Set();for(const cat of CATEGORIES){const sides=cat.bilateral?['right','left']:['none'];for(const side of sides){const f=findings[fkey(cat.id,side)];if(!hasFinding(f))continue;if(f.selected.some(o=>o!=='normal'&&o!=='balanced')){tags.add(cat.id);break}}}return tags}
/* ================= カタログ：追加テスト ================= */
const APP_DETAIL='アプリ補完（出典未確認）';
function T(seed){return Object.assign({targets:'未登録',startPosition:APP_DETAIL,examinerPosition:APP_DETAIL,stabilization:APP_DETAIL,direction:APP_DETAIL,measurement:'方法欄の手順で左右同条件で記録する。',normalRef:null,compensation:'未登録',interpPositive:'所見との関連を検討する材料になります（原因の確定ではありません）。',interpNegative:'この要因を主因とする説明は弱まります。',caution:'疼痛や危険徴候があれば中止してください。',references:'未登録',evidence:'unverified'},seed)}
const MVP_TEST_ORDER=['stance','hip','trunk','extension','load','shoulder','scapula'];
const TESTS=[
T({id:'hipIR',name:'股関節内旋ROM（左右）',origin:'v112',kind:'bilateral',unit:'°',refLow:30,minDiff:11,minDiffBasis:'MDC95 検者間8〜11°（Langhout 2018）の上限側。検者が変わる運用を前提に保守値を採用（同一検者・同一プロトコルなら8°）',tags:['pelvis','hip','knee'],purpose:'股関節回旋の左右差と可動域制限を記録',method:'座位または腹臥位で股関節・膝関節を約90°屈曲し、骨盤を固定して左右の内旋角度を測る。測定姿勢を統一する。',compensation:'骨盤回旋・股関節外転・体幹側屈',reliability:'検者内ICC 0.88〜0.95／検者間ICC 0.75〜0.86（Prather 2010、Langhout 2018）。左右差の最小差は検者間を前提に11°',references:'Prather 2010 (PMID: 20970757)、Langhout 2018 (DOI: 10.2519/jospt.2018.7990)',diagram:'supine',triggers:[{cat:'pelvis',opts:['rot_r','rot_l']},{cat:'hip',opts:['ir','er']}]}),
T({id:'hipER',name:'股関節外旋ROM（左右）',origin:'v112',kind:'bilateral',unit:'°',minDiff:11,minDiffBasis:'研究間のばらつきが大きい（検者間ICC 0.18〜0.77）ため保守値11°（MDC95 検者間8〜11°の上限側）',tags:['pelvis','hip'],purpose:'外旋可動域と左右差の確認',method:'座位または腹臥位で骨盤を固定し、左右の外旋角度を記録。内旋と同じ姿勢・器具で測定する。',compensation:'骨盤回旋・腰椎の代償',reliability:'検者内ICC 0.85〜0.95／検者間ICC 0.18（腹臥位）〜0.77と研究間で大きく異なる（Prather 2010、Langhout 2018）。体位・器具を固定し、最小差は保守値11°',references:'Prather 2010 (PMID: 20970757)、Langhout 2018 (DOI: 10.2519/jospt.2018.7990)',diagram:'supine',triggers:[{cat:'pelvis',opts:['rot_r','rot_l']},{cat:'hip',opts:['ir','er']}]}),

function activeHypotheses(findings){return HYPOTHESES.filter(h=>anyTriggerHits(findings,h.findingTriggers).length>0)}
function suggestedTests(findings,tests){const tags=activeTagCats(findings);const ruleUse={};for(const h of activeHypotheses(findings)){const ids=new Set();for(const r of (h.rules||[]))ids.add(r.testId);for(const r of (h.requiresAll||[]))ids.add(r.testId);for(const tid of ids){if(!ruleUse[tid])ruleUse[tid]=[];if(ruleUse[tid].indexOf(h)<0)ruleUse[tid].push(h)}}
  const scored=TESTS.map((test,idx)=>{const matched=test.tags.filter(t=>tags.has(t));const reasons=anyTriggerHits(findings,test.triggers);const useHyps=ruleUse[test.id]||[];for(const h of useHyps)reasons.push(isNoEvidenceTest(test)?'記録用（エビデンスなし：仮説の判定には使われません）':'仮説「'+h.title+'」の検証に使えます');const mi=MVP_TEST_ORDER.indexOf(test.id);return{test,reasons:Array.from(new Set(reasons)),score:matched.length,ruleCount:useHyps.length,mvpIdx:mi===-1?100:mi,idx,done:testDone(tests[test.id])}}).filter(s=>s.score>0||s.reasons.length>0||s.ruleCount>0);
  const tier=s=>s.ruleCount>=2?0:(s.ruleCount===1?1:2);
  scored.sort((a,b)=>(Number(a.done)-Number(b.done))||(tier(a)-tier(b))||(b.ruleCount-a.ruleCount)||(b.score-a.score)||(a.mvpIdx-b.mvpIdx)||(a.idx-b.idx));return scored}

const GUIDE_INTRO=`この資料は、ボディリーディング・チャートの「構造的評価」14項目について、何を観察するか・どう確かめるか・どの所見でチェックするかをまとめた実務用ガイドです。チャート本体と併せてご使用ください。

評価をそろえるための基本ルール
01 自然立位を統一する：裸足で、無理に姿勢を正さず楽に立つ。足幅・つま先の角度・膝の伸展状態をそろえ、正面／背面／左右側面の順で観察する。
02 左右の定義：R／L は常に対象者本人の右／左。左右別の欄がある部位は、右・左それぞれにチェックする。
03 基準は「反復して明瞭」：いったん姿勢をリセットして2回以上確認し、同じ偏りが観察できたときにチェックする。明確でなければ空欄とし、「保留／不明」をメモに残す。
04 目印を比較する：耳珠、肩峰、ASIS、PSIS、肩甲骨の下角、膝蓋骨、内外果などの骨指標を左右で比較する。側面観察の基準は重心線（外果のやや前方―膝関節のやや前方―大転子―肩峰―耳珠）。
05 動作所見は分けて記録する：呼吸、肩の挙上、体幹の回旋、軽いスクワット、歩行などは参考になるが、静止姿勢の所見と動的な所見は必ず区別して書く。
06 程度を付けると経過が追いやすい：チェックの横に 0＝所見なし／1＝軽度（要再確認）／2＝明瞭／3＝顕著 を付記できる。これは便宜的な記録の尺度であり、検証された重症度ではない。
注意：姿勢の左右差やアーチの形は個人差が大きく、それ単独では痛み・障害・原因となる筋を特定できません。感覚の異常、進行する筋力低下、強い痛み、息苦しさなどがある場合は、施術の判断の前に適切な医療評価を優先してください。`;

weight:`観察方向：正面・背面／目印：両足の接地、足底の前後・左右の圧、骨盤・体幹の位置
評価方法：裸足で自然立位を取り、20～30秒静止させる。左右それぞれの足底で「どこに圧を感じるか」を尋ね、骨盤の側方偏位や靴底のすり減り方も参考にする。可能であれば2台の体重計に片足ずつ乗り、左右荷重を実測して2回確認する。

右優位／左優位：その側の足の荷重が反対側より一貫して大きい。骨盤がその側へ偏位して見えることもある。2台の体重計の左右差は荷重比の記録に使い、数値だけで異常とは判定しない。

breath:`観察方向：正面・側面／目印：胸骨上部、下部肋骨、腹壁、左右肋骨の動き

head:`観察方向：側面・正面／目印：耳珠、肩峰、鼻・顎の正中、左右の耳の高さ

neck:`観察方向：側面・正面／目印：耳珠～肩峰の位置関係、頸部の輪郭、棘突起列

girdle:`観察方向：正面・背面／腕は脱力／目印：肩峰、鎖骨、肩甲棘、肩甲骨内側縁・下角、胸郭

shoulder:`観察方向：正面・側面／目印：上腕骨頭付近、肩峰、肘窩、上腕の軸

thorax:`観察方向：正面・側面・背面／目印：胸骨、下部肋骨弓、胸郭の中心、骨盤の中心

lumbar:`観察方向：側面・背面／目印：腰部の輪郭、腰椎棘突起列、仙骨、下位肋骨

pelvis:`観察方向：正面・側面・背面／目印：ASIS（上前腸骨棘）、PSIS（上後腸骨棘）、腸骨稜

hip:`観察方向：正面・背面／目印：骨盤の正面、大腿骨の向き、膝蓋骨の向き、つま先の向き

knee:`観察方向：正面・側面／目印：大腿の軸、膝関節の中心、脛骨の軸、内外果

  if(parsed.format==='posture-lab'){const data=(typeof parsed.data==='object'&&parsed.data!==null)?parsed.data:{};const sessions=Array.isArray(data.sessions)?data.sessions:[];const converted=sessions.map(convertV1Session).filter(x=>x!==null);if(converted.length===0)return{error:'取り込めるセッションがありませんでした。'};return{sessions:converted}}

  return{error:'対応していない形式のファイルです（リンク版 / v1.1.2 / MVP 0.1 のJSONに対応）。'}}

/* 1ページに収まらないブロックを要素・行の境界で分割する（行やテキストの途中で割らない） */
function splitBlock(block,limitPx){
  if(block.offsetHeight<=limitPx)return [block];
  const table=block.querySelector('table');
  if(table){
    const head=Array.from(block.children).filter(el=>el!==table);
    const thead=table.querySelector('thead');
    const rows=Array.from(table.querySelectorAll('tbody tr'));
    const headH=head.reduce((a,el)=>a+el.offsetHeight,0);
    const theadH=thead?thead.offsetHeight:0;
    const mkChunk=function(rowsSubset,includeHead){const w=document.createElement('div');if(includeHead)head.forEach(el=>w.appendChild(el.cloneNode(true)));const t=document.createElement('table');if(thead)t.appendChild(thead.cloneNode(true));const tb=document.createElement('tbody');rowsSubset.forEach(r=>tb.appendChild(r.cloneNode(true)));t.appendChild(tb);w.appendChild(t);return w};
    const chunks=[];let cur=[];let curH=headH+theadH;
    for(const r of rows){const rh=r.offsetHeight;if(cur.length&&curH+rh>limitPx){chunks.push(mkChunk(cur,chunks.length===0));cur=[];curH=theadH}cur.push(r);curH+=rh}
    if(cur.length)chunks.push(mkChunk(cur,chunks.length===0));
    if(chunks.length)return chunks;
  }
  const parts=[];let cur=document.createElement('div');let curH=0;
  for(const child of Array.from(block.children)){const ch=child.offsetHeight;if(cur.children.length&&curH+ch>limitPx){parts.push(cur);cur=document.createElement('div');curH=0}cur.appendChild(child.cloneNode(true));curH+=ch}
  if(cur.children.length)parts.push(cur);
  return parts.length?parts:[block];
}
/* PDF生成：セクション単位に描画し、A4ページへ収まるよう配置する（途中で切れない改ページ） */
async function generateReportPDF(s){
  const container=document.createElement('div');
  container.className='pdfgen';
  container.innerHTML=reportPrintHTML(s);
  const kids=Array.from(container.children);container.innerHTML='';
  const blocks=[];
  for(let i=0;i<kids.length;i++){const w=document.createElement('div');w.appendChild(kids[i]);if(kids[i].tagName==='H2'&&i+1<kids.length){w.appendChild(kids[i+1]);i++}container.appendChild(w);blocks.push(w)}
  document.body.appendChild(container);
  try{
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    doc.setProperties({title:reportFileName(s)});
    const pageW=210,pageH=297,margin=14,contentW=pageW-margin*2,contentH=pageH-margin*2;
    /* 高さ上限（px）はブロック幅から換算し、収まらないブロックは境界で分割してから配置する */
    const units=[];
    for(const block of blocks){
      const limitPx=Math.floor(contentH/contentW*(block.clientWidth||684));
      const chunks=splitBlock(block,limitPx);
      if(chunks.length===1&&chunks[0]===block){units.push(block)}
      else{for(const c of chunks){container.insertBefore(c,block);units.push(c)}container.removeChild(block)}
    }
    let y=margin;
    for(const block of units){
      const canvas=await html2canvas(block,{scale:2,backgroundColor:'#ffffff',logging:false});
      const hmm=canvas.height/canvas.width*contentW;
      if(hmm<=contentH){
        if(y+hmm>pageH-margin){doc.addPage();y=margin}
        doc.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',margin,y,contentW,hmm);
        y+=hmm+1.5;
      }else{
        const slicePx=Math.max(1,Math.floor(contentH/contentW*canvas.width));
        let offset=0;
        while(offset<canvas.height){
          if(offset>0||y>margin){doc.addPage();y=margin}
          const h=Math.min(slicePx,canvas.height-offset);
          const c2=document.createElement('canvas');c2.width=canvas.width;c2.height=h;
          const ctx=c2.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c2.width,h);
          ctx.drawImage(canvas,0,offset,canvas.width,h,0,0,canvas.width,h);
          const shmm=h/canvas.width*contentW;
          doc.addImage(c2.toDataURL('image/jpeg',0.95),'JPEG',margin,y,contentW,shmm);
          y+=shmm;offset+=h;
        }
        y+=1.5;
      }
    }
    return doc;
  }finally{document.body.removeChild(container)}
}

    measurementThresholds:{byTest:TESTS.filter(t=>typeof t.minDiff==='number').map(t=>({testId:t.id,testName:t.name,minDiff:t.minDiff,unit:t.unit||null,basis:t.minDiffBasis||null})),note:'左右差の最小差はテスト別に、MDC等の根拠に基づく値を用います（単位一律の便宜的設定は廃止）。左右差の絶対値がテスト別の最小差以上ある場合のみ、測定値による手がかりとして扱います。',secondsFallback:{value:3,unit:'秒',status:'エビデンス未確認（便宜的設定）',note:'時間（秒）で測る項目は今回の検証対象外のため、従来の便宜的設定3秒を維持します。'},noEvidenceTests:TESTS.filter(t=>t.evidenceUse==='none').map(t=>({testId:t.id,testName:t.name,note:t.evidenceNote||null,handling:'記録と表示は残しますが、仮説の支持・反証（手がかり判定）とリリース連携の根拠には使いません。'})),thomasRule:{testId:'thomas',minDiff:6,unit:'°',note:'トーマステストは角度方式（骨盤統制＋傾斜計等で股関節伸展角を測定し、数値が入力されている場合）のみ仮説の根拠にします。pass/fail（陽性/陰性）だけの結果は根拠に数えません（pass/fail判定のkappa 検者内0.40／検者間0.33）。角度の左右差の目安6°はSEM約2°からの換算値で、原著のMDC報告はありません。'},referenceLowerBounds:TESTS.filter(t=>typeof t.refLow==='number').map(t=>({testId:t.id,refLow:t.refLow,unit:t.unit||null,note:'左右両方の値がこの参考下限未満の場合に「両側とも参考値未満」として測定値の手がかりに数えます。参考値です。'})),releaseHypothesisGate:specClone(RELEASE_HYP_GATE),releaseGateNote:'所見連携型のリリース候補は、対応する仮説の見立てが「手がかりあり」の場合のみ推奨化します。'},
    constants:specClone({UNVERIFIED:UNVERIFIED,ORIGIN_LABEL:ORIGIN_LABEL,APP_DETAIL:APP_DETAIL,MVP_TEST_ORDER:MVP_TEST_ORDER,HYP_LEVEL_LABEL:HYP_LEVEL_LABEL,UNIT_MIN_DIFF:UNIT_MIN_DIFF,NO_EVIDENCE_TEST_IDS:TESTS.filter(t=>t.evidenceUse==='none').map(t=>t.id),RELEASE_HYP_GATE:RELEASE_HYP_GATE,RELEASE_METHOD:RELEASE_METHOD,RELEASE_WARNING:RELEASE_WARNING,GUIDE_RECORD:GUIDE_RECORD}),
    categories:{guideIntro:GUIDE_INTRO,items:CATEGORIES.map(c=>{const o=specClone(c);o.guide=(GUIDES[c.id]===undefined?null:GUIDES[c.id]);return o})},
    tests:{items:specClone(TESTS)},
    hypotheses:{classes:specClone(HYP_CLASSES),items:specClone(HYPOTHESES)},
    releases:{method:RELEASE_METHOD,warning:RELEASE_WARNING,items:RELEASES.map(r=>{const o=specClone(r);o.atLines=(RELEASE_LINES[r.id]===undefined?null:RELEASE_LINES[r.id].slice());return o})},
    anatomyTrains:{lines:specClone(AT_LINES),releaseLines:specClone(RELEASE_LINES),findingLines:specClone(FINDING_LINES)},
    engine:{functions:engineFunctions}
  };
}
function exportSpecJSON(){
  const spec=buildSpecExport();
  const blob=new Blob([JSON.stringify(spec,null,2)],{type:'application/json;charset=utf-8'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='posture_lab_spec_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
  const el=document.getElementById('specStatus');
  if(el){const c=spec.validation.counts;el.textContent=spec.validation.ok?('検証OK：カテゴリ'+c.categories.actual+'件・テスト'+c.tests.actual+'件・仮説'+c.hypotheses.actual+'件・リリース'+c.releases.actual+'件を書き出しました'):('警告：'+spec.validation.warnings.join('／'))}
}

checkLegacy();
render();
